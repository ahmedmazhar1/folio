<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio API · Integration example</title><style>body{margin:0;font:14px system-ui;background:#f7f4f6;color:#162e50}header{padding:20px;background:white}canvas{display:block;width:100%;height:70vh}footer{padding:20px;display:flex;gap:20px;justify-content:center}input{width:300px;accent-color:#162e50}a{color:inherit}</style><header><a href="/api-docs">Folio API</a> / Standalone integration example</header><canvas id="viewer"></canvas><footer><label>Closed <input id="progress" type="range" min="0" max="1" step=".001" value="0"> Flat</label><span id="status">Loading box…</span></footer><script src="/vendor/three.min.js"></script><script src="/folding-engine.js"></script><script>
(async()=>{const canvas=document.getElementById('viewer'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0xabb6c8,1));const light=new THREE.DirectionalLight(0xffffff,.7);light.position.set(3,5,4);scene.add(light);const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(4,5,8);camera.lookAt(0,0,0);try{const response=await fetch('/api/v1/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template_id:'mailer',dimensions:{L:220,W:150,H:60}})});if(!response.ok)throw Error('Could not load model');const manifest=await response.json();const model=FolioFolding.mount(THREE,manifest,{materials:()=>new THREE.MeshStandardMaterial({color:0xe8b5cb,roughness:.8})});scene.add(model.group);document.getElementById('progress').oninput=e=>model.setProgress(+e.target.value);document.getElementById('status').textContent='Powered by Folio';function size(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(size).observe(canvas);function frame(){renderer.render(scene,camera);requestAnimationFrame(frame)}size();frame()}catch(e){document.getElementById('status').textContent=e.message}})();
</script></html>
